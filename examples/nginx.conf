# Example: hints from examples/tcpfp.js, logged, and passed to a backend
# that scores them. None of them should block on its own.

load_module modules/ngx_http_tcp_fingerprint_module.so;
load_module modules/ngx_http_js_module.so;

http {
    tcp_fingerprint on;

    js_path /etc/nginx/njs;
    js_import tcpfp from tcpfp.js;
    js_shared_dict_zone zone=tcpfp:1m timeout=10m;
    js_set $tcpfp_hints tcpfp.hints;

    log_format fp '$remote_addr "$http_user_agent" sig=$tcpfp_signature '
                  'tls_rtt=$tcpfp_tls_rtt tcp_rtt=$tcpfp_tcp_rtt '
                  'hints=$tcpfp_hints';

    server {
        listen 443 ssl;
        http2 on;
        access_log /var/log/nginx/fp.log fp;

        location / {
            proxy_set_header X-TCP-Signature $tcpfp_signature;
            proxy_set_header X-TCP-Hints     $tcpfp_hints;
            proxy_pass http://backend;
        }
    }
}
